name: Gold player queue validation

on:
  pull_request:
    paths:
      - 'app/src/main/java/org/schabi/newpipe/player/**'
      - 'app/src/main/java/org/schabi/newpipe/fragments/list/**'
      - 'app/src/main/res/menu/gold_multi_select.xml'
      - 'app/src/main/res/values/strings.xml'
      - '.github/workflows/gold-player-validation.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub's Ubuntu runner already provides ANDROID_HOME and Android SDK tools.
      # setup-android runs sdkmanager --update, which can fail before compilation.
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK: $ANDROID_HOME"
      - name: Validate Android debug compilation
        run: ./gradlew :app:compileDebugJavaWithJavac :app:compileDebugKotlin --stacktrace
