name: NewPipe Gold signed release APK

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '.github/workflows/gold-signed-release.yml'

permissions:
  contents: read

jobs:
  signed-release:
    # Never expose signing secrets to forked pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Gold signing key
        env:
          GOLD_KEYSTORE_BASE64: ${{ secrets.GOLDKEYSTOREBASE64 }}
          GOLD_STORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORT }}
          GOLD_KEY_ALIAS: ${{ secrets.KEYALIAS }}
          GOLD_KEY_PASSWORD: ${{ secrets.GOLDKEYPASSWORT }}
        run: |
          set -euo pipefail
          for value in GOLD_KEYSTORE_BASE64 GOLD_STORE_PASSWORD GOLD_KEY_ALIAS GOLD_KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "::error::Missing required GitHub Actions secret: $value"
              exit 1
            fi
          done
          printf '%s' "$GOLD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gold-release.jks"
          echo "GOLD_SIGNING_STORE_FILE=$RUNNER_TEMP/gold-release.jks" >> "$GITHUB_ENV"
          echo "GOLD_SIGNING_STORE_PASSWORD=$GOLD_STORE_PASSWORD" >> "$GITHUB_ENV"
          # Prefer the configured alias; recover safely when the keystore contains
          # exactly one private-key entry and the saved alias is outdated.
          # Check the keystore using the store password without exposing key material.
          if ! keytool -list -keystore "$RUNNER_TEMP/gold-release.jks" -storepass:env GOLD_STORE_PASSWORD >/dev/null 2>&1; then
            echo "::error::Keystore cannot be opened with KEYSTOREPASSWORT; verify the stored keystore and store password."
            exit 1
          fi
          if ! keytool -list -alias "$GOLD_KEY_ALIAS" -keystore "$RUNNER_TEMP/gold-release.jks" -storepass:env GOLD_STORE_PASSWORD >/dev/null 2>&1; then
            # keytool -list emits 'alias, date, PrivateKeyEntry, ...'. Avoid
            # verbose output localization and never print the alias in logs.
            actual_alias="$(keytool -J-Duser.language=en -J-Duser.country=US -list -keystore "$RUNNER_TEMP/gold-release.jks" -storepass:env GOLD_STORE_PASSWORD | awk -F',' '/PrivateKeyEntry/ { a=$1; sub(/^[[:space:]]+/, "", a); sub(/[[:space:]]+$/, "", a); print a }')"
            count="$(printf '%s\n' "$actual_alias" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$count" != 1 ]; then
              echo "::error::Saved KEYALIAS does not match; keystore contains $count detectable private-key entries. Check KEYALIAS against the original keystore."
              exit 1
            fi
            GOLD_KEY_ALIAS="$actual_alias"
            echo "::notice::Recovered the only private-key alias from the existing keystore."
          fi
          echo "GOLD_SIGNING_KEY_ALIAS=$GOLD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GOLD_SIGNING_KEY_PASSWORD=$GOLD_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed Gold release APK
        # Monotonic release versionCode across subsequent runs of this workflow.
        run: ./gradlew :app:assembleRelease -DversionCodeOverride=$((100000 + GITHUB_RUN_NUMBER)) --stacktrace
      - name: Verify signed release APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          # Prevent accidentally shipping a second app with a branch-specific ID.
          EXPECTED_PACKAGE="org.schabi.newpipe.gold"
          ACTUAL_PACKAGE="$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          if [ "$ACTUAL_PACKAGE" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Wrong APK package: $ACTUAL_PACKAGE (expected $EXPECTED_PACKAGE)"
            exit 1
          fi
          echo "Verified update package: $ACTUAL_PACKAGE"
          # Display the actual Android versionCode to diagnose update downgrades.
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep '^package:'
          # apksigner versions format certificate labels differently. The verification
          # exit code above is authoritative; certificate output is diagnostic only.
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          mkdir -p release-artifact
          cp "$APK" release-artifact/NewPipe-Gold-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NewPipe-Gold-signed-release
          path: release-artifact/NewPipe-Gold-release.apk
          retention-days: 14
