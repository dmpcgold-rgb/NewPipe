name: NewPipe Gold signed release APK

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '.github/workflows/gold-signed-release.yml'

permissions:
  contents: read

jobs:
  signed-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Gold signing key
        env:
          GOLD_KEYSTORE_BASE64: ${{ secrets.GOLDKEYSTOREBASE64 }}
          GOLD_STORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORT }}
          GOLD_KEY_ALIAS: ${{ secrets.KEYALIAS }}
          GOLD_KEY_PASSWORD: ${{ secrets.GOLDKEYPASSWORT }}
        run: |
          set -euo pipefail
          for value in GOLD_KEYSTORE_BASE64 GOLD_STORE_PASSWORD GOLD_KEY_ALIAS GOLD_KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "::error::Missing required GitHub Actions secret: $value"
              exit 1
            fi
          done
          printf '%s' "$GOLD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gold-release.jks"
          echo "GOLD_SIGNING_STORE_FILE=$RUNNER_TEMP/gold-release.jks" >> "$GITHUB_ENV"
          echo "GOLD_SIGNING_STORE_PASSWORD=$GOLD_STORE_PASSWORD" >> "$GITHUB_ENV"
          # Prefer the configured alias; recover safely when the keystore contains
          # exactly one private-key entry and the saved alias is outdated.
          if ! keytool -list -alias "$GOLD_KEY_ALIAS" -keystore "$RUNNER_TEMP/gold-release.jks" -storepass:env GOLD_STORE_PASSWORD >/dev/null 2>&1; then
            actual_alias="$(keytool -J-Duser.language=en -J-Duser.country=US -list -v -keystore "$RUNNER_TEMP/gold-release.jks" -storepass:env GOLD_STORE_PASSWORD 2>/dev/null | awk -F': ' '/^Alias name: / { a=$2 } /^Entry type: PrivateKeyEntry/ { print a }')"
            if [ -z "$actual_alias" ] || [ "$(printf '%s\\n' "$actual_alias" | wc -l)" -ne 1 ]; then
              echo "::error::Configured key alias is absent, and keystore does not contain exactly one private key entry."
              exit 1
            fi
            GOLD_KEY_ALIAS="$actual_alias"
            echo "::notice::Using the sole private-key alias found in the existing keystore."
          fi
          echo "GOLD_SIGNING_KEY_ALIAS=$GOLD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GOLD_SIGNING_KEY_PASSWORD=$GOLD_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed Gold release APK
        run: ./gradlew :app:assembleRelease -DpackageSuffix=.gold --stacktrace
      - name: Verify signed release APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          mkdir -p release-artifact
          cp "$APK" release-artifact/NewPipe-Gold-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NewPipe-Gold-signed-release
          path: release-artifact/NewPipe-Gold-release.apk
          retention-days: 14
