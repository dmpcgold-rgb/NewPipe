name: NewPipe Gold APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'app/**'
      - 'buildSrc/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradlew'
      - '.github/workflows/gold-apk.yml'

permissions:
  contents: read

concurrency:
  group: newpipe-gold-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Configure all four secrets once in Settings > Secrets and variables > Actions:
      # GOLD_KEYSTORE_BASE64, GOLD_STORE_PASSWORD, GOLD_KEY_ALIAS, GOLD_KEY_PASSWORD.
      # Using a stable keystore preserves Android updates between GitHub Actions runs.
      - name: Prepare stable signing keystore
        env:
          GOLD_KEYSTORE_BASE64: ${{ secrets.GOLD_KEYSTORE_BASE64 }}
          GOLD_STORE_PASSWORD: ${{ secrets.GOLD_STORE_PASSWORD }}
          GOLD_KEY_ALIAS: ${{ secrets.GOLD_KEY_ALIAS }}
          GOLD_KEY_PASSWORD: ${{ secrets.GOLD_KEY_PASSWORD }}
        run: |
          if [ -n "$GOLD_KEYSTORE_BASE64" ]; then
            if [ -z "$GOLD_STORE_PASSWORD" ] || [ -z "$GOLD_KEY_ALIAS" ] || [ -z "$GOLD_KEY_PASSWORD" ]; then
              echo "::error::Configure all four Gold signing secrets."
              exit 1
            fi
            printf '%s' "$GOLD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gold-release.jks"
            chmod 600 "$RUNNER_TEMP/gold-release.jks"
            echo "GOLD_SIGNING_STORE_FILE=$RUNNER_TEMP/gold-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Stable signing secrets missing: debug-signed test APK cannot reliably update older builds."
          fi

      - name: Check code style and build continuous APK
        env:
          GOLD_SIGNING_STORE_PASSWORD: ${{ secrets.GOLD_STORE_PASSWORD }}
          GOLD_SIGNING_KEY_ALIAS: ${{ secrets.GOLD_KEY_ALIAS }}
          GOLD_SIGNING_KEY_PASSWORD: ${{ secrets.GOLD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew :app:runCheckstyle :app:assembleContinuous --stacktrace 2>&1 | tee gradle-build.log; then
              exit 0
            fi
            # Retry transient artifact repository failures; don't hide source or test errors.
            if ! grep -Eiq 'Gateway Time-out|status code 50[234]|Read timed out|Connection reset|Could not GET|Temporary failure in name resolution' gradle-build.log; then
              echo "::error::Gradle failed with a non-network error."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Dependency download failed after 3 attempts."
              exit 1
            fi
            sleep 15
          done

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/continuous -maxdepth 1 -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then exit 1; fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NewPipe-Gold-Test-APK
          path: app/build/outputs/apk/continuous/*.apk
          if-no-files-found: error
          retention-days: 1
