name: NewPipe Gold APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradlew'
      - '.github/workflows/gold-apk.yml'

permissions:
  contents: read

concurrency:
  group: newpipe-gold-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build signed continuous APK
        run: ./gradlew :app:assembleContinuous --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NewPipe-Gold-Test-APK
          path: app/build/outputs/apk/continuous/*.apk
          if-no-files-found: error
          retention-days: 1
